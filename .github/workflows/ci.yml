name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cargo
          POSTGRES_PASSWORD: cargo123
          POSTGRES_DB: cargoflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile check
        run: npm run lint

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://cargo:cargo123@localhost:5432/cargoflow_test
        run: npm run db:migrate

      - name: Run tests
        env:
          DATABASE_URL: postgresql://cargo:cargo123@localhost:5432/cargoflow_test
          JWT_SECRET: test-jwt-secret
        run: npm test

      - name: Build Docker images
        run: |
          docker build -f docker/Dockerfile.api -t cargoflow-api:latest .
          docker build -f docker/Dockerfile.worker -t cargoflow-worker:latest .
          docker build -f docker/Dockerfile.realtime -t cargoflow-realtime:latest .

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        run: |
          docker build -f docker/Dockerfile.api -t ghcr.io/${{ github.repository }}/api:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}/api:${{ github.sha }}

      - name: Build and push Worker image
        run: |
          docker build -f docker/Dockerfile.worker -t ghcr.io/${{ github.repository }}/worker:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}/worker:${{ github.sha }}

      - name: Build and push Realtime image
        run: |
          docker build -f docker/Dockerfile.realtime -t ghcr.io/${{ github.repository }}/realtime:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}/realtime:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/cargoflow
            docker compose pull
            docker compose up -d --no-deps api worker realtime
            docker system prune -f
