version: "3.8"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cargo
      POSTGRES_PASSWORD: cargo123
      POSTGRES_DB: cargoflow
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo -d cargoflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://cargo:cargo123@db:5432/cargoflow
      WS_SERVER_URL: http://realtime:3001
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://cargo:cargo123@db:5432/cargoflow
      WS_SERVER_URL: http://realtime:3001
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  realtime:
    build:
      context: .
      dockerfile: docker/Dockerfile.realtime
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  uploads:
  redis_data:
